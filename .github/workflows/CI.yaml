name: ci

env:
  DEBUG: napi:*
  APP_NAME: undms
  MACOSX_DEPLOYMENT_TARGET: '10.13'
  CARGO_INCREMENTAL: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
  pull_request: null
  workflow_dispatch:

concurrency:
  group: >-
    ${{ github.workflow }}-${{ startsWith(github.event.head_commit.message, 'release: v') && github.sha || github.ref }}
  cancel-in-progress: >-
    ${{ !startsWith(github.event.head_commit.message, 'release: v') }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - name: Check formatting, lint, and types
        run: vp check
      - name: Typecheck tests
        run: vp run typecheck
      - name: Cargo fmt
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-15-intel
            target: x86_64-apple-darwin
            build: vp run build --target x86_64-apple-darwin
          - host: windows-latest
            build: vp run build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: vp run build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: vp run build --target x86_64-unknown-linux-musl -x
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: vp run build --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: macos-latest
            target: aarch64-apple-darwin
            build: vp run build --target aarch64-apple-darwin
    name: stable - ${{ matrix.settings.target }} - node@24.11.0
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}
      - name: Cache cross-compilation toolchains
        uses: actions/cache@v5
        with:
          path: ~/.napi-rs
          key: napi-cross-${{ runner.os }}-${{ runner.arch }}-${{ matrix.settings.target }}-${{ hashFiles('pnpm-lock.yaml') }}
      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            ${{ env.APP_NAME }}.*.node
            ${{ env.APP_NAME }}.*.wasm
          if-no-files-found: error
  test-macOS-windows-binding:
    name: Test bindings on ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
        node:
          - '22.18.0'
          - '24.11.0'
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Setup project
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: Test bindings
        run: vp run test:bindings
  test-linux-binding:
    name: Test ${{ matrix.target }} - node@${{ matrix.node }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
        node:
          - '22.18.0'
          - '24.11.0'
    runs-on: ${{ contains(matrix.target, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Output docker params
        id: docker
        run: |
          node -e "
            if ('${{ matrix.target }}'.startsWith('aarch64')) {
              console.log('PLATFORM=linux/arm64')
            } else {
              console.log('PLATFORM=linux/amd64')
            }
          " >> $GITHUB_OUTPUT
          node -e "
            if ('${{ matrix.target }}'.endsWith('-musl')) {
              console.log('IMAGE=node:${{ matrix.node }}-alpine')
            } else {
              console.log('IMAGE=node:${{ matrix.node }}-slim')
            }
          " >> $GITHUB_OUTPUT
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - name: Test bindings
        env:
          TEST_IMAGE: ${{ steps.docker.outputs.IMAGE }}
          TEST_PLATFORM: ${{ steps.docker.outputs.PLATFORM }}
        run: |
          # Install dependencies inside the target libc, not on the host runner.
          # An anonymous volume keeps host node_modules out of the container.
          docker run --rm \
            --platform "$TEST_PLATFORM" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --volume "$GITHUB_WORKSPACE/node_modules" \
            --env "PROJECT_DIR=$GITHUB_WORKSPACE" \
            --workdir /tmp \
            "$TEST_IMAGE" sh -eu -c '
              package_manager=$(node -p "require(process.env.PROJECT_DIR + \"/package.json\").packageManager")
              # Bootstrap outside the project; npm is only used to install pnpm.
              npm install --global "$package_manager"
              cd "$PROJECT_DIR"
              pnpm install --frozen-lockfile
              pnpm run test:bindings
            '
  ci:
    name: CI
    if: always()
    needs: [lint, build, test-macOS-windows-binding, test-linux-binding]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case "$RESULTS" in
            *failure*|*cancelled*|*skipped*)
              echo "One or more required jobs did not pass."
              exit 1
              ;;
          esac
