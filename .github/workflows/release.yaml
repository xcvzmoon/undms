name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    if: >-
      startsWith(github.event.head_commit.message, 'chore(release): v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Verify release commit and tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$(git log -1 --format=%s)" = "chore(release): v$version"
          test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$(git rev-parse HEAD)"
      - name: Check release metadata
        run: |
          vp check
          vp run typecheck
      - name: Create or sync GitHub release
        env:
          GENBUMPPUSH_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          vp exec genbumppush --retry-github "v$version" --yes
