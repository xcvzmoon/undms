name: Publish

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore(release): v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout tested release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit and tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$(git log -1 --format=%s)" = "chore(release): v$version"
          test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$(git rev-parse HEAD)"
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Download tested bindings
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: bindings-*
          path: artifacts
      - name: Download generated package entry points
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: package-entry-points
          path: .
      - name: Create npm dirs
        run: vp run create-npm-dirs
      - name: Synchronize platform dependency versions
        run: vp run version
      - name: Move artifacts
        run: vp run artifacts --output-dir ./artifacts --npm-dir ./npm
      - name: Setup pnpm for publishing
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Verify publishing toolchain
        run: pnpm --version
      - name: Validate and publish packages using OIDC only
        run: node scripts/publish.ts --trusted-only
