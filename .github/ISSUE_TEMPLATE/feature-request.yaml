name: Feature Request
description: Suggest a new feature or improvement for undms
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you are trying to solve, not just the solution you have in mind.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the existing issues and this feature has not been requested yet.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the project would this feature touch?
      options:
        - Document extraction (src)
        - Node.js bindings
        - Native platform packages
        - Tests / benchmarks
        - Build / CI / Tooling
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What is the use case?
      placeholder: 'As a user, I want to ... so that ...'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like this to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches or workarounds you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, references to similar features in other tools, or anything else that helps.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this feature.
          required: false
