name: Bug Report
description: Report a defect or unexpected behavior in undms
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue quickly.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight Checklist
      options:
        - label: I have searched the existing issues and this bug has not been reported yet.
          required: true
        - label: I am running the latest version of undms.
          required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the project is affected?
      options:
        - Document extraction (src)
        - Node.js bindings
        - Native platform packages
        - Tests / benchmarks
        - Build / CI / Tooling
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: The commit SHA or version you are running.
      placeholder: 'e.g. 74ab7d0'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node Version
      description: Output of `node --version`.
      placeholder: 'v24.11.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: 'e.g. macOS 15.5, Windows 11 24H2, Ubuntu 24.04'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reliably reproduce the behavior.
      placeholder: |
        1. Install undms
        2. Call extract with ...
        3. Observe the result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any relevant log output or attach screenshots. Logs are automatically formatted as code, no backticks needed.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else that might help us understand the problem.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit a pull request for this bug.
          required: false
