
[package]
authors = ["Mon Albert Gamil <mrgamilmonalbert@gmail.com>"]
edition = "2024"
name    = "undms"
version = "1.6.2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
calamine = "0.33.0"
chardetng = "0.1.17"
encoding_rs = "0.8.35"
futures-util = "0.3"
image = { version = "0.25.9", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "bmp",
  "tiff",
  "webp",
] }
lopdf = "0.39.0"
napi = { version = "3.14.0", features = ["async", "napi8"] }
napi-derive = "3.6.10"
ocrs = "0.12.0"
quick-xml = "0.38.3"
rayon = "1.11.0"
rten = "0.24.0"
tokio = { version = "1", features = ["sync"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto   = true
strip = "symbols"
